<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deniz Ozbakir — CV</title>
<meta name="description" content="CV de Deniz Ozbakir — Génie Civil et Urbanisme, INSA Lyon.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#525659;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(12px,2.5vw,24px) clamp(6px,1.5vw,12px) 60px;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  .bar{
    width:100%;max-width:900px;margin-bottom:clamp(8px,1.5vw,16px);
    display:flex;justify-content:flex-end;
  }
  .btn{
    display:inline-flex;align-items:center;gap:.55em;
    background:#4267c9;color:#fff;text-decoration:none;
    padding:.7em 1.3em;border-radius:.55em;
    font-size:clamp(12px,2.6vw,15px);font-weight:600;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
    white-space:nowrap;
  }
  .btn:hover{background:#3a5ab0}
  .btn svg{width:1.2em;height:1.2em}
  .page{
    width:100%;max-width:900px;
    background:#fff;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
    display:block;
  }
  .page img{width:100%;height:auto;display:block}
</style>
</head>
<body>
  <div class="bar">
    <a class="btn" href="cv.pdf" download="CV_Deniz_Ozbakir.pdf">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      Télécharger le PDF
    </a>
  </div>
  <object class="page" type="image/svg+xml" data="cv.svg" aria-label="CV de Deniz Ozbakir">
    <img src="page-1.png" alt="CV de Deniz Ozbakir">
  </object>
</body>
</html>
